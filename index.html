<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta name="theme-color" content="#202b2a">

  <title>しおの ときお, 田中 亨...(3)"</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="app">

    <!-- ==============================
         チャットヘッダー
    =============================== -->
    <header class="chat-header">

      <div class="header-avatar">
        <img
          id="headerAvatar"
          src="assets/friend-avatar.svg"
          alt=""
        >
      </div>

      <div class="header-info">

        <div
          id="gameTitle"
          class="header-title"
        >
          しおの ときお, 田中 亨...(3)
        </div>

        <div
          id="headerStatus"
          class="header-status"
        >
          オンライン
        </div>

      </div>

    </header>


    <!-- ==============================
         チャット履歴
    =============================== -->
    <section
      id="chat"
      class="chat"
      aria-live="polite"
      aria-label="チャット履歴"
    >
    </section>


    <!-- ==============================
         入力中表示
    =============================== -->
    <div
      id="typingIndicator"
      class="typing-indicator"
      hidden
    >

      <span class="typing-avatar">

        <img
          id="typingAvatar"
          src="assets/friend-avatar.svg"
          alt=""
        >

      </span>

      <span class="typing-bubble">

        <i></i>
        <i></i>
        <i></i>

      </span>

      <span class="typing-text">
        入力中…
      </span>

    </div>


    <!-- ==============================
         回答欄
    =============================== -->
    <section
      id="answerArea"
      class="answer-area"
      aria-label="回答欄"
    >
    </section>


    <!-- ==============================
         ゲーム開始
    =============================== -->
    <div
      id="startArea"
      class="start-area"
    >

      <button
        id="startButton"
        class="primary-button"
      >
      トークに参加する
      </button>

    </div>


    <!-- ==============================
         プレゼント画面
    =============================== -->
    <section
      id="rewardArea"
      class="reward-area"
      hidden
    >

      <div class="reward-card">

        <div class="reward-icon">
          🎁
        </div>

        <h2 id="rewardTitle">
          プレゼント
        </h2>

        <p id="rewardMessage">
          全問正解おめでとうございます！
        </p>


        <button
          id="showRewardButton"
          class="primary-button"
        >
          プレゼントを見る
        </button>


        <!--
          最初は非表示。
          「プレゼントを見る」を押した後に表示する。
        -->
        <div
          id="rewardCodeBox"
          class="reward-code-box"
          hidden
        >

          <div class="reward-label">
            iTunes / Apple Gift Card コード
          </div>

          <div
            id="rewardCode"
            class="reward-code"
          >
          </div>

          <p
            id="rewardAfterMessage"
            class="reward-after-message"
          >
          </p>

        </div>


        <button
          id="restartButton"
          class="secondary-button"
        >
          もう一度遊ぶ
        </button>

      </div>

    </section>


  </main>


  <!-- ==============================
       紙吹雪
  =============================== -->
  <div
    id="confetti"
    class="confetti"
    aria-hidden="true"
  >
  </div>


  <!-- ==============================
       設定
  =============================== -->
  <script src="questions.js"></script>

  <!-- ==============================
       ゲーム本体
  =============================== -->
  <script src="app.js"></script>

</body>
</html>
